[project]
name = "lakehouse-jobs"
version = "0.3.1"
description = "Jobs Spark do lakehouse (gerador, streaming CDF, migrations)"
requires-python = ">=3.10"
dependencies = [
    # alinhado ao pin da imagem spark-delta (Python 3.10 => numpy < 2.3)
    "numpy>=2.2,<2.3",
]

[dependency-groups]
dev = [
    # DEV ONLY: no runtime o pyspark vem do /opt/spark da imagem, nunca do PyPI
    "pyspark==4.1.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse_jobs"]
