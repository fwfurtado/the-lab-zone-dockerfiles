name: Build, Versionamento e Push para o GHCR

on:
  push:
    branches:
      - main
    paths:
      - 'dbt-runner/**'
      - 'goose-runner/**'
      - 'lightrag-langfuse/**'
      - 'mcp-server-qdrant/**'
      - 'qa-indexer/**'

env:
  REGISTRY: ghcr.io

jobs:
  # JOB 1: Detecta quais pastas mudaram para evitar builds desnecessários
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Mantém para garantir o histórico local das tags

      - name: Verificar caminhos alterados
        id: set-matrix
        run: |
          APPS=()

          # Captura com precisão o número de commits incluídos NESTE push específico
          COMMIT_COUNT=$(echo "${{ github.event.commits && github.event.commits || '' }}" | jq '. | length' 2>/dev/null || echo "1")

          # Se por algum motivo o contador falhar ou der 0, assume 1 commit padrão
          if [ "$COMMIT_COUNT" -eq 0 ]; then
            COMMIT_COUNT=1
          fi

          echo "Total de commits incluídos no push: $COMMIT_COUNT"

          # Define o intervalo seguro usando referências HEAD relativas (ex: HEAD~3 HEAD)
          DIFF_REF="HEAD~$COMMIT_COUNT HEAD"
          echo "Analisando diff para o intervalo seguro: $DIFF_REF"

          # Executa o diff usando as referências locais que o runner com certeza conhece
          git diff --name-only $DIFF_REF | grep -q "^dbt-runner/" && APPS+=('"dbt-runner"')
          git diff --name-only $DIFF_REF | grep -q "^goose-runner/" && APPS+=('"goose-runner"')
          git diff --name-only $DIFF_REF | grep -q "^lightrag-langfuse/" && APPS+=('"lightrag-langfuse"')
          git diff --name-only $DIFF_REF | grep -q "^mcp-server-qdrant/" && APPS+=('"mcp-server-qdrant"')
          git diff --name-only $DIFF_REF | grep -q "^qa-indexer/" && APPS+=('"qa-indexer"')

          echo "APPS detectados: ${APPS[@]}"

          if [ ${#APPS[@]} -gt 0 ]; then
            MATRIX_JSON="[$(echo ${APPS[@]} | sed 's/ /,/g')]"
            echo "matrix=$MATRIX_JSON" >> $GITHUB_OUTPUT
          else
            echo "matrix=[]" >> $GITHUB_OUTPUT
          fi
  # JOB 2: Calcula a versão automaticamente e faz o Build/Push
  build-and-push:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' }} # Só roda se houver mudanças
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que a ferramenta crie tags de versão no Git
      packages: write # Permite publicar no GHCR

    strategy:
      matrix:
        image_name: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessário histórico completo para calcular a versão com precisão

      - name: Calcular Próxima Versão Automaticamente
        id: semver
        uses: grumpy-programmer/conventional-commits-semver-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Filtra os commits para olhar apenas as mensagens que mencionam a pasta do app
          # Exemplo de commit esperado: "feat(imagem-app-1): nova feature"
          tag-prefix: "${{ matrix.image_name }}-v"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push da Imagem
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image_name }}
          file: ./${{ matrix.image_name }}/Dockerfile
          push: true
          # Usa a tag calculada pela ferramenta e atualiza a latest
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ steps.semver.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.semver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
